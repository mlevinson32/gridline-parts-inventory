<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Parts Inventory · Gridline</title>
</head>
<body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --gl-orange:      #EC8A00;
    --gl-orange-dark: #A55F00;
    --gl-orange-tint: #FEF3E4;
    --gl-charcoal:    #1C1D21;
    --gl-charcoal-2:  #2B2D33;

    --surface-1:      #ffffff;
    --page:           #F6F6F8;
    --text-primary:   #1C1D21;
    --text-secondary: #63666E;
    --text-muted:     #9A9CA3;
    --gridline:       #ECEDF0;
    --baseline:       #D8DADF;
    --accent:         var(--gl-orange);
    --accent-dark:    var(--gl-orange-dark);
    --accent-tint:    var(--gl-orange-tint);
    --good:           #148A44;
    --good-bg:        #E7F6ED;
    --warning:        #B4750B;
    --warning-bg:     #FDF0D8;
    --critical:       #C6333B;
    --critical-bg:    #FBEAEA;
    --border:         rgba(28,29,33,0.08);
    --shadow-sm:      0 1px 2px rgba(28,29,33,0.04), 0 1px 1px rgba(28,29,33,0.03);
    --shadow-md:      0 8px 24px rgba(28,29,33,0.08), 0 2px 6px rgba(28,29,33,0.04);
    --shadow-lg:      0 20px 48px rgba(28,29,33,0.18), 0 4px 12px rgba(28,29,33,0.08);
    --radius-lg:      16px;
    --radius-md:      10px;
    --radius-sm:      8px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
    background: var(--page);
    color: var(--text-primary);
    font-size: 14px;
    -webkit-font-smoothing: antialiased;
  }
  #partsInventoryRoot { padding: 0 0 48px; max-width: 1220px; margin: 0 auto; }

  /* ---------- Brand bar ---------- */
  .pi-brandbar {
    background: linear-gradient(135deg, var(--gl-charcoal) 0%, var(--gl-charcoal-2) 100%);
    padding: 18px 28px;
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 24px;
    border-radius: 0 0 var(--radius-lg) var(--radius-lg);
  }
  .pi-brand { display: flex; align-items: center; gap: 10px; }
  .pi-logomark {
    width: 30px; height: 30px; border-radius: 8px;
    display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; gap: 3px;
    padding: 4px; background: rgba(255,255,255,0.06);
  }
  .pi-logomark span { background: var(--gl-orange); border-radius: 2px; }
  .pi-logomark span:nth-child(1) { opacity: 1; }
  .pi-logomark span:nth-child(2) { opacity: 0.55; }
  .pi-logomark span:nth-child(3) { opacity: 0.55; }
  .pi-logomark span:nth-child(4) { opacity: 1; }
  .pi-wordmark { color: #fff; font-weight: 800; font-size: 17px; letter-spacing: -0.01em; }
  .pi-wordmark span { color: var(--gl-orange); }
  .pi-brand-tag {
    font-size: 11px; font-weight: 600; color: rgba(255,255,255,0.55);
    text-transform: uppercase; letter-spacing: 0.06em; margin-left: 6px;
    padding-left: 10px; border-left: 1px solid rgba(255,255,255,0.18);
  }

  #partsInventoryBody { padding: 0 28px; }

  .pi-header { display: flex; align-items: flex-end; justify-content: space-between; margin-bottom: 18px; gap: 16px; flex-wrap: wrap; }
  .pi-title { font-size: 22px; font-weight: 800; margin: 0 0 3px; letter-spacing: -0.01em; }
  .pi-subtitle { font-size: 13px; color: var(--text-secondary); margin: 0; }
  .pi-actions { display: flex; gap: 8px; flex-wrap: wrap; }

  .btn {
    font-family: inherit; font-size: 13px; font-weight: 600; cursor: pointer;
    border-radius: 999px; padding: 9px 16px; border: 1px solid var(--border);
    background: var(--surface-1); color: var(--text-primary);
    box-shadow: var(--shadow-sm); transition: transform 0.05s ease, box-shadow 0.15s ease, background 0.15s ease;
  }
  .btn:hover { background: var(--gridline); box-shadow: var(--shadow-md); }
  .btn:active { transform: translateY(1px); }
  .btn-primary { background: var(--gl-orange); color: var(--gl-charcoal); border-color: var(--gl-orange); }
  .btn-primary:hover { background: #d97e00; }
  .btn-danger { color: var(--critical); }
  .btn-sm { padding: 5px 12px; font-size: 12px; }
  .btn:disabled { opacity: 0.5; cursor: default; }

  .pi-card {
    background: var(--surface-1); border: 1px solid var(--border); border-radius: var(--radius-lg);
    padding: 20px 22px; margin-bottom: 16px; box-shadow: var(--shadow-sm);
  }

  .pi-banner {
    display: flex; align-items: flex-start; gap: 14px;
    background: var(--critical-bg); border: 1px solid rgba(198,51,59,0.18);
    border-radius: var(--radius-lg); padding: 16px 18px; margin-bottom: 18px;
    box-shadow: var(--shadow-sm);
  }
  .pi-banner.ok { background: var(--good-bg); border-color: rgba(20,138,68,0.18); }
  .pi-banner-icon {
    width: 32px; height: 32px; border-radius: 50%; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 15px; background: rgba(198,51,59,0.12); color: var(--critical);
  }
  .pi-banner.ok .pi-banner-icon { background: rgba(20,138,68,0.12); color: var(--good); }
  .pi-banner-body { flex: 1; padding-top: 2px; }
  .pi-banner-title { font-weight: 700; font-size: 14px; margin-bottom: 3px; }
  .pi-banner-list { font-size: 12.5px; color: var(--text-secondary); }
  .pi-banner-meta { font-size: 11.5px; color: var(--text-muted); margin-top: 6px; }

  .pi-toolbar { display: flex; gap: 10px; align-items: center; margin-bottom: 14px; flex-wrap: wrap; }
  .pi-search {
    flex: 1; min-width: 220px; padding: 10px 14px; border: 1px solid var(--baseline);
    border-radius: 999px; font-size: 13px; font-family: inherit; background: var(--page); color: var(--text-primary);
    transition: border-color 0.15s, background 0.15s;
  }
  .pi-search:focus { outline: none; border-color: var(--gl-orange); background: var(--surface-1); }
  .pi-filter-pill {
    padding: 7px 14px; border-radius: 999px; border: 1px solid var(--border);
    font-size: 12px; font-weight: 600; cursor: pointer; background: var(--surface-1); color: var(--text-secondary);
    transition: all 0.15s;
  }
  .pi-filter-pill:hover { border-color: var(--baseline); }
  .pi-filter-pill.active { background: var(--gl-charcoal); color: #fff; border-color: var(--gl-charcoal); }

  table.pi-table { width: 100%; border-collapse: collapse; font-size: 13px; }
  table.pi-table th {
    text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em;
    color: var(--text-muted); font-weight: 700; padding: 10px; border-bottom: 1px solid var(--baseline);
  }
  table.pi-table td { padding: 12px 10px; border-bottom: 1px solid var(--gridline); vertical-align: middle; }
  table.pi-table tr:last-child td { border-bottom: none; }
  table.pi-table tbody tr { transition: background 0.1s; }
  table.pi-table tbody tr:hover { background: var(--page); }
  .pi-sku { font-weight: 700; font-variant-numeric: tabular-nums; }
  .pi-desc-sub { display: block; font-size: 11.5px; color: var(--text-muted); margin-top: 1px; }
  .pi-qty { font-variant-numeric: tabular-nums; font-weight: 700; }
  .pi-pill { display: inline-flex; align-items: center; gap: 4px; padding: 4px 11px; border-radius: 999px; font-size: 11.5px; font-weight: 700; }
  .pi-pill.ok { background: var(--good-bg); color: var(--good); }
  .pi-pill.low { background: var(--warning-bg); color: var(--warning); }
  .pi-pill.out { background: var(--critical-bg); color: var(--critical); }
  .pi-row-actions { display: flex; gap: 6px; align-items: center; }
  .pi-stepper { display: inline-flex; align-items: center; border: 1px solid var(--border); border-radius: 999px; overflow: hidden; background: var(--page); }
  .pi-stepper button { border: none; background: transparent; width: 24px; height: 26px; cursor: pointer; font-size: 14px; color: var(--text-secondary); }
  .pi-stepper button:hover { background: var(--gridline); color: var(--text-primary); }
  .pi-empty { text-align: center; padding: 48px 0; color: var(--text-muted); font-size: 13px; }

  .pi-overlay {
    position: fixed; inset: 0; background: rgba(20,20,22,0.45); backdrop-filter: blur(2px); display: flex;
    align-items: center; justify-content: center; z-index: 50;
  }
  .pi-modal {
    background: var(--surface-1); border-radius: var(--radius-lg); padding: 24px 26px; width: 440px;
    max-width: calc(100vw - 40px); max-height: calc(100vh - 60px); overflow-y: auto;
    box-shadow: var(--shadow-lg); border-top: 4px solid var(--gl-orange);
  }
  .pi-modal h2 { font-size: 17px; font-weight: 800; margin: 0 0 18px; }
  .pi-field { margin-bottom: 13px; }
  .pi-field label { display: block; font-size: 12px; font-weight: 700; color: var(--text-secondary); margin-bottom: 5px; }
  .pi-field input, .pi-field textarea, .pi-field select {
    width: 100%; padding: 9px 12px; border: 1px solid var(--baseline); border-radius: var(--radius-sm);
    font-size: 13px; font-family: inherit; background: var(--page); color: var(--text-primary);
    transition: border-color 0.15s, background 0.15s;
  }
  .pi-field input:focus, .pi-field textarea:focus, .pi-field select:focus {
    outline: none; border-color: var(--gl-orange); background: var(--surface-1);
  }
  .pi-field-row { display: flex; gap: 10px; }
  .pi-field-row .pi-field { flex: 1; }
  .pi-field-hint { font-size: 11px; color: var(--text-muted); margin-top: 4px; line-height: 1.45; }
  .pi-modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 18px; }

  .pi-toast {
    position: fixed; bottom: 24px; right: 24px; background: var(--gl-charcoal); color: #fff;
    padding: 11px 18px; border-radius: 999px; font-size: 13px; font-weight: 600; z-index: 60; opacity: 0;
    box-shadow: var(--shadow-lg);
    transform: translateY(6px); transition: all 0.15s;
  }
  .pi-toast.show { opacity: 1; transform: translateY(0); }

  .pi-checkbox-row { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
  .pi-checkbox-row input { width: auto; accent-color: var(--gl-orange); }
  .pi-loading { padding: 48px 0; text-align: center; color: var(--text-muted); }
</style>
<div id="partsInventoryRoot">
  <div class="pi-brandbar">
    <div class="pi-brand">
      <div class="pi-logomark"><span></span><span></span><span></span><span></span></div>
      <div class="pi-wordmark">Grid<span>line</span></div>
      <div class="pi-brand-tag">Parts Inventory</div>
    </div>
  </div>

  <div id="partsInventoryBody">
    <div class="pi-header">
      <div>
        <p class="pi-title">Parts Inventory</p>
        <p class="pi-subtitle">Track SKUs, quantities on hand, and low-stock reorder reminders.</p>
      </div>
      <div class="pi-actions">
        <button class="btn" id="piSettingsBtn">Reminder Settings</button>
        <button class="btn" id="piExportBtn">Export CSV</button>
        <button class="btn" id="piImportBtn">Import CSV</button>
        <input type="file" id="piImportFile" accept=".csv" style="display:none;">
        <button class="btn btn-primary" id="piAddBtn">+ Add Part</button>
      </div>
    </div>

    <div id="piBannerSlot"></div>

    <div class="pi-card">
      <div class="pi-toolbar">
        <input type="text" class="pi-search" id="piSearch" placeholder="Search by SKU, description, or supplier…">
        <button class="pi-filter-pill active" data-filter="all">All</button>
        <button class="pi-filter-pill" data-filter="low">Needs Reorder</button>
        <button class="pi-filter-pill" data-filter="out">Out of Stock</button>
      </div>
      <div id="piTableSlot"><div class="pi-loading">Loading inventory…</div></div>
    </div>
  </div>
</div>

<div id="piModalSlot"></div>
<div class="pi-toast" id="piToast"></div>

<script>
(function () {
  var STATUS = { OK: 'ok', LOW: 'low', OUT: 'out' };

  geotab.addin.partsInventory = function () {
    var api = null;
    var elRoot = null;
    var parts = [];        // {id, version, sku, description, qtyOnHand, reorderThreshold, reorderQty, supplier, location, unitCost, updatedAt}
    var settings = { id: null, version: null, webhookUrl: '', emails: '', autoCheck: true, lastNotified: {} };
    var activeFilter = 'all';
    var searchTerm = '';

    function toast(msg) {
      var t = document.getElementById('piToast');
      t.textContent = msg;
      t.classList.add('show');
      setTimeout(function () { t.classList.remove('show'); }, 2600);
    }

    function statusOf(p) {
      if (p.qtyOnHand <= 0) return STATUS.OUT;
      if (p.qtyOnHand <= p.reorderThreshold) return STATUS.LOW;
      return STATUS.OK;
    }

    // ---------- Data layer (MyGeotab AddInData — shared across your team) ----------
    var ADDIN_ID = "aKueQ3wrboQN04pbgAD5wNA"; // stable per-install identifier for this add-in's data

    function loadAll(callback) {
      api.call("Get", {
        typeName: "AddInData",
        search: { addInId: ADDIN_ID }
      }, function (result) {
        parts = [];
        settings = { id: null, version: null, webhookUrl: '', emails: '', autoCheck: true, lastNotified: {} };
        (result || []).forEach(function (row) {
          var d = row.details || {};
          if (d.type === 'part') {
            parts.push({
              id: row.id, version: row.version,
              sku: d.sku, description: d.description || '',
              qtyOnHand: Number(d.qtyOnHand) || 0,
              reorderThreshold: Number(d.reorderThreshold) || 0,
              reorderQty: Number(d.reorderQty) || 0,
              supplier: d.supplier || '', location: d.location || '',
              unitCost: d.unitCost != null ? Number(d.unitCost) : null,
              updatedAt: d.updatedAt || ''
            });
          } else if (d.type === 'settings') {
            settings = {
              id: row.id, version: row.version,
              webhookUrl: d.webhookUrl || '', emails: d.emails || '',
              autoCheck: d.autoCheck !== false, lastNotified: d.lastNotified || {}
            };
          }
        });
        parts.sort(function (a, b) { return a.sku.localeCompare(b.sku); });
        callback && callback();
      }, function (err) {
        console.error("[Parts Inventory] load failed", err);
        toast("Couldn't load inventory data — see console for details.");
        callback && callback();
      });
    }

    function savePart(part, callback) {
      var details = {
        type: 'part', sku: part.sku, description: part.description,
        qtyOnHand: part.qtyOnHand, reorderThreshold: part.reorderThreshold,
        reorderQty: part.reorderQty, supplier: part.supplier, location: part.location,
        unitCost: part.unitCost, updatedAt: new Date().toISOString()
      };
      if (part.id) {
        api.call("Set", { typeName: "AddInData", entity: { id: part.id, version: part.version, addInId: ADDIN_ID, details: details } },
          function () { callback && callback(); },
          function (err) { console.error(err); toast("Save failed."); });
      } else {
        api.call("Add", { typeName: "AddInData", entity: { addInId: ADDIN_ID, details: details } },
          function () { callback && callback(); },
          function (err) { console.error(err); toast("Save failed."); });
      }
    }

    function deletePart(part, callback) {
      api.call("Remove", { typeName: "AddInData", entity: { id: part.id } },
        function () { callback && callback(); },
        function (err) { console.error(err); toast("Delete failed."); });
    }

    function saveSettings(callback) {
      var details = {
        type: 'settings', webhookUrl: settings.webhookUrl, emails: settings.emails,
        autoCheck: settings.autoCheck, lastNotified: settings.lastNotified
      };
      if (settings.id) {
        api.call("Set", { typeName: "AddInData", entity: { id: settings.id, version: settings.version, addInId: ADDIN_ID, details: details } },
          function () { callback && callback(); });
      } else {
        api.call("Add", { typeName: "AddInData", entity: { addInId: ADDIN_ID, details: details } },
          function () { callback && callback(); });
      }
    }

    // ---------- Low stock check + reminder ----------
    function lowStockParts() {
      return parts.filter(function (p) { return statusOf(p) !== STATUS.OK; });
    }

    function maybeSendReminder(force) {
      var low = lowStockParts();
      var today = new Date().toISOString().slice(0, 10);
      var due = low.filter(function (p) { return force || settings.lastNotified[p.sku] !== today; });
      if (!due.length) return;
      if (!settings.webhookUrl) return;

      fetch(settings.webhookUrl, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          event: 'low_stock_alert',
          generatedAt: new Date().toISOString(),
          recipients: settings.emails,
          parts: due.map(function (p) {
            return { sku: p.sku, description: p.description, qtyOnHand: p.qtyOnHand, reorderThreshold: p.reorderThreshold, reorderQty: p.reorderQty, supplier: p.supplier };
          })
        })
      }).then(function () {
        due.forEach(function (p) { settings.lastNotified[p.sku] = today; });
        saveSettings();
        toast("Reminder sent for " + due.length + " part(s).");
      }).catch(function (err) {
        console.error("[Parts Inventory] webhook failed", err);
        toast("Reminder webhook failed — check the URL in Reminder Settings.");
      });
    }

    // ---------- Rendering ----------
    function render() {
      renderBanner();
      renderTable();
    }

    function renderBanner() {
      var slot = document.getElementById('piBannerSlot');
      var low = lowStockParts();
      if (!low.length) {
        slot.innerHTML = '<div class="pi-banner ok"><div class="pi-banner-icon">✓</div>' +
          '<div class="pi-banner-body"><div class="pi-banner-title">All parts are stocked above reorder level.</div></div></div>';
        return;
      }
      var names = low.slice(0, 6).map(function (p) { return p.sku; }).join(', ') + (low.length > 6 ? ', +' + (low.length - 6) + ' more' : '');
      slot.innerHTML =
        '<div class="pi-banner">' +
          '<div class="pi-banner-icon">⚠</div>' +
          '<div class="pi-banner-body">' +
            '<div class="pi-banner-title">' + low.length + ' part' + (low.length > 1 ? 's' : '') + ' at or below reorder threshold</div>' +
            '<div class="pi-banner-list">' + names + '</div>' +
            '<div class="pi-banner-meta">' + (settings.webhookUrl ? 'Email reminder configured — sends automatically once per day this add-in is opened.' : 'No reminder webhook configured — set one up in Reminder Settings to get email alerts.') + '</div>' +
          '</div>' +
          '<button class="btn btn-sm" id="piSendNowBtn">Send Reminder Now</button>' +
        '</div>';
      var btn = document.getElementById('piSendNowBtn');
      if (btn) btn.onclick = function () { maybeSendReminder(true); };
    }

    function filteredParts() {
      return parts.filter(function (p) {
        if (activeFilter === 'low' && statusOf(p) === STATUS.OK) return false;
        if (activeFilter === 'out' && statusOf(p) !== STATUS.OUT) return false;
        if (searchTerm) {
          var hay = (p.sku + ' ' + p.description + ' ' + p.supplier).toLowerCase();
          if (hay.indexOf(searchTerm.toLowerCase()) === -1) return false;
        }
        return true;
      });
    }

    function renderTable() {
      var slot = document.getElementById('piTableSlot');
      var list = filteredParts();
      if (!list.length) {
        slot.innerHTML = '<div class="pi-empty">No parts match. Try clearing the search or filter, or add a new part.</div>';
        return;
      }
      var rows = list.map(function (p) {
        var st = statusOf(p);
        var pillClass = st === STATUS.OK ? 'ok' : (st === STATUS.LOW ? 'low' : 'out');
        var pillLabel = st === STATUS.OK ? 'In stock' : (st === STATUS.LOW ? 'Reorder' : 'Out of stock');
        return '<tr data-id="' + p.id + '">' +
          '<td><span class="pi-sku">' + escapeHtml(p.sku) + '</span><span class="pi-desc-sub">' + escapeHtml(p.description) + '</span></td>' +
          '<td>' +
            '<div class="pi-stepper">' +
              '<button data-action="dec" data-id="' + p.id + '">−</button>' +
              '<span class="pi-qty" style="padding:0 8px;">' + p.qtyOnHand + '</span>' +
              '<button data-action="inc" data-id="' + p.id + '">+</button>' +
            '</div>' +
          '</td>' +
          '<td>' + p.reorderThreshold + '</td>' +
          '<td>' + p.reorderQty + '</td>' +
          '<td>' + escapeHtml(p.supplier || '—') + '</td>' +
          '<td>' + escapeHtml(p.location || '—') + '</td>' +
          '<td><span class="pi-pill ' + pillClass + '">' + pillLabel + '</span></td>' +
          '<td class="pi-row-actions">' +
            '<button class="btn btn-sm" data-action="edit" data-id="' + p.id + '">Edit</button>' +
            '<button class="btn btn-sm btn-danger" data-action="delete" data-id="' + p.id + '">Delete</button>' +
          '</td>' +
        '</tr>';
      }).join('');

      slot.innerHTML =
        '<table class="pi-table"><thead><tr>' +
          '<th>SKU / Description</th><th>On Hand</th><th>Reorder At</th><th>Reorder Qty</th>' +
          '<th>Supplier</th><th>Location</th><th>Status</th><th></th>' +
        '</tr></thead><tbody>' + rows + '</tbody></table>';

      slot.querySelectorAll('button[data-action]').forEach(function (btn) {
        btn.addEventListener('click', function () {
          var id = btn.getAttribute('data-id');
          var action = btn.getAttribute('data-action');
          var part = parts.filter(function (p) { return p.id === id; })[0];
          if (!part) return;
          if (action === 'inc' || action === 'dec') {
            part.qtyOnHand = Math.max(0, part.qtyOnHand + (action === 'inc' ? 1 : -1));
            savePart(part, function () { render(); });
          } else if (action === 'edit') {
            openPartModal(part);
          } else if (action === 'delete') {
            if (confirm('Delete ' + part.sku + '? This can\'t be undone.')) {
              deletePart(part, function () { loadAll(render); });
            }
          }
        });
      });
    }

    function escapeHtml(s) {
      return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
      });
    }

    // ---------- Modals ----------
    function closeModal() { document.getElementById('piModalSlot').innerHTML = ''; }

    function openPartModal(existing) {
      var p = existing || { id: null, version: null, sku: '', description: '', qtyOnHand: 0, reorderThreshold: 5, reorderQty: 10, supplier: '', location: '', unitCost: null };
      var html =
        '<div class="pi-overlay" id="piOverlay"><div class="pi-modal">' +
          '<h2>' + (existing ? 'Edit Part' : 'Add Part') + '</h2>' +
          '<div class="pi-field"><label>SKU</label><input id="fSku" value="' + escapeHtml(p.sku) + '" placeholder="e.g. FLT-2200"></div>' +
          '<div class="pi-field"><label>Description</label><input id="fDesc" value="' + escapeHtml(p.description) + '" placeholder="e.g. Oil filter, HD diesel"></div>' +
          '<div class="pi-field-row">' +
            '<div class="pi-field"><label>Qty on Hand</label><input id="fQty" type="number" value="' + p.qtyOnHand + '"></div>' +
            '<div class="pi-field"><label>Reorder At (qty)</label><input id="fThreshold" type="number" value="' + p.reorderThreshold + '"></div>' +
          '</div>' +
          '<div class="pi-field-row">' +
            '<div class="pi-field"><label>Reorder Qty</label><input id="fReorderQty" type="number" value="' + p.reorderQty + '"></div>' +
            '<div class="pi-field"><label>Unit Cost ($, optional)</label><input id="fCost" type="number" step="0.01" value="' + (p.unitCost != null ? p.unitCost : '') + '"></div>' +
          '</div>' +
          '<div class="pi-field-row">' +
            '<div class="pi-field"><label>Supplier</label><input id="fSupplier" value="' + escapeHtml(p.supplier) + '"></div>' +
            '<div class="pi-field"><label>Location / Depot</label><input id="fLocation" value="' + escapeHtml(p.location) + '"></div>' +
          '</div>' +
          '<div class="pi-modal-actions">' +
            '<button class="btn" id="piCancelBtn">Cancel</button>' +
            '<button class="btn btn-primary" id="piSaveBtn">Save</button>' +
          '</div>' +
        '</div></div>';
      document.getElementById('piModalSlot').innerHTML = html;
      document.getElementById('piCancelBtn').onclick = closeModal;
      document.getElementById('piSaveBtn').onclick = function () {
        var sku = document.getElementById('fSku').value.trim();
        if (!sku) { toast('SKU is required.'); return; }
        var updated = {
          id: p.id, version: p.version, sku: sku,
          description: document.getElementById('fDesc').value.trim(),
          qtyOnHand: Number(document.getElementById('fQty').value) || 0,
          reorderThreshold: Number(document.getElementById('fThreshold').value) || 0,
          reorderQty: Number(document.getElementById('fReorderQty').value) || 0,
          supplier: document.getElementById('fSupplier').value.trim(),
          location: document.getElementById('fLocation').value.trim(),
          unitCost: document.getElementById('fCost').value ? Number(document.getElementById('fCost').value) : null
        };
        savePart(updated, function () { closeModal(); loadAll(function () { render(); toast('Saved.'); }); });
      };
    }

    function openSettingsModal() {
      var html =
        '<div class="pi-overlay" id="piOverlay"><div class="pi-modal">' +
          '<h2>Reminder Settings</h2>' +
          '<div class="pi-field"><label>Notification webhook URL</label>' +
            '<input id="fWebhook" value="' + escapeHtml(settings.webhookUrl) + '" placeholder="https://hooks.zapier.com/hooks/catch/…">' +
            '<div class="pi-field-hint">Add-ins run in your browser and can\'t send email directly. Paste a Zapier / Make / Power Automate (or your own) webhook URL here — it receives a JSON payload of low-stock parts and you connect it to send the email or SMS.</div>' +
          '</div>' +
          '<div class="pi-field"><label>Recipients (for your reference / passed to webhook)</label>' +
            '<input id="fEmails" value="' + escapeHtml(settings.emails) + '" placeholder="parts@example.com, manager@example.com"></div>' +
          '<div class="pi-checkbox-row"><input type="checkbox" id="fAutoCheck" ' + (settings.autoCheck ? 'checked' : '') + '>' +
            '<label style="margin:0;">Automatically check and send once per day when this add-in is opened</label></div>' +
          '<div class="pi-field-hint" style="margin-bottom:14px;">For reminders that fire even when nobody opens the add-in, point an external scheduler (e.g. a scheduled cloud function) at the MyGeotab API on a timer and reuse this same webhook — see the README for the pattern.</div>' +
          '<div class="pi-modal-actions">' +
            '<button class="btn" id="piCancelBtn">Cancel</button>' +
            '<button class="btn btn-primary" id="piSaveSettingsBtn">Save</button>' +
          '</div>' +
        '</div></div>';
      document.getElementById('piModalSlot').innerHTML = html;
      document.getElementById('piCancelBtn').onclick = closeModal;
      document.getElementById('piSaveSettingsBtn').onclick = function () {
        settings.webhookUrl = document.getElementById('fWebhook').value.trim();
        settings.emails = document.getElementById('fEmails').value.trim();
        settings.autoCheck = document.getElementById('fAutoCheck').checked;
        saveSettings(function () { closeModal(); toast('Settings saved.'); });
      };
    }

    // ---------- CSV import/export ----------
    function exportCsv() {
      var header = ['sku', 'description', 'qtyOnHand', 'reorderThreshold', 'reorderQty', 'supplier', 'location', 'unitCost'];
      var lines = [header.join(',')];
      parts.forEach(function (p) {
        lines.push(header.map(function (k) {
          var v = p[k] == null ? '' : String(p[k]);
          return '"' + v.replace(/"/g, '""') + '"';
        }).join(','));
      });
      var blob = new Blob([lines.join('\n')], { type: 'text/csv' });
      var a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'parts_inventory_export.csv';
      a.click();
    }

    function importCsv(file) {
      var reader = new FileReader();
      reader.onload = function () {
        var lines = String(reader.result).split(/\r?\n/).filter(Boolean);
        if (!lines.length) return;
        var header = parseCsvLine(lines[0]);
        var rows = lines.slice(1).map(parseCsvLine);
        var toSave = rows.map(function (cols) {
          var obj = {};
          header.forEach(function (h, i) { obj[h.trim()] = cols[i]; });
          return {
            id: null, version: null,
            sku: obj.sku || '', description: obj.description || '',
            qtyOnHand: Number(obj.qtyOnHand) || 0,
            reorderThreshold: Number(obj.reorderThreshold) || 0,
            reorderQty: Number(obj.reorderQty) || 0,
            supplier: obj.supplier || '', location: obj.location || '',
            unitCost: obj.unitCost ? Number(obj.unitCost) : null
          };
        }).filter(function (p) { return p.sku; });

        var remaining = toSave.length;
        if (!remaining) { toast('No valid rows found in CSV.'); return; }
        toSave.forEach(function (p) {
          savePart(p, function () {
            remaining--;
            if (remaining === 0) loadAll(function () { render(); toast('Imported ' + toSave.length + ' part(s).'); });
          });
        });
      };
      reader.readAsText(file);
    }

    function parseCsvLine(line) {
      var out = []; var cur = ''; var inQuotes = false;
      for (var i = 0; i < line.length; i++) {
        var c = line[i];
        if (inQuotes) {
          if (c === '"' && line[i + 1] === '"') { cur += '"'; i++; }
          else if (c === '"') { inQuotes = false; }
          else { cur += c; }
        } else {
          if (c === '"') inQuotes = true;
          else if (c === ',') { out.push(cur); cur = ''; }
          else cur += c;
        }
      }
      out.push(cur);
      return out;
    }

    // ---------- Wire up static controls ----------
    function wireControls() {
      document.getElementById('piAddBtn').onclick = function () { openPartModal(null); };
      document.getElementById('piSettingsBtn').onclick = openSettingsModal;
      document.getElementById('piExportBtn').onclick = exportCsv;
      document.getElementById('piImportBtn').onclick = function () { document.getElementById('piImportFile').click(); };
      document.getElementById('piImportFile').onchange = function (e) {
        if (e.target.files && e.target.files[0]) importCsv(e.target.files[0]);
        e.target.value = '';
      };
      document.getElementById('piSearch').oninput = function (e) { searchTerm = e.target.value; renderTable(); };
      elRoot.querySelectorAll('.pi-filter-pill').forEach(function (pill) {
        pill.addEventListener('click', function () {
          elRoot.querySelectorAll('.pi-filter-pill').forEach(function (p2) { p2.classList.remove('active'); });
          pill.classList.add('active');
          activeFilter = pill.getAttribute('data-filter');
          renderTable();
        });
      });
    }

    return {
      initialize: function (freshApi, state, callback) {
        api = freshApi;
        elRoot = document.getElementById('partsInventoryRoot');
        wireControls();
        loadAll(function () {
          render();
          callback();
        });
      },
      focus: function (freshApi, state) {
        api = freshApi;
        loadAll(function () {
          render();
          if (settings.autoCheck) maybeSendReminder(false);
        });
      },
      blur: function () {
        closeModal();
      }
    };
  };
})();
</script>
</body>
</html>
